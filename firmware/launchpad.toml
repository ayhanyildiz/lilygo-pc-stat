# ESP Launchpad configuration for the original LILYGO T-Dongle-S3 only.
# The binary is merged and must be written at address 0x0.
esp_toml_version = 1.0
supported_apps = ["LILYGO-T-Dongle-S3-PC-Stat"]
multipart = true
chip = "esp32s3"

[LILYGO-T-Dongle-S3-PC-Stat]
console_baudrate = 115200
readme.text = "https://raw.githubusercontent.com/ayhanyildiz/lilygo-pc-stat/main/firmware/FLASHING.md"
image.esp32s3.parts = ["https://raw.githubusercontent.com/ayhanyildiz/lilygo-pc-stat/main/firmware/tdongle-s3-pc-stat.bin"]
image.esp32s3.addresses = ["0x0"]
